name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Guardar o app (arquivo único) como artefato
        uses: actions/upload-artifact@v4
        with:
          name: showroom3d-html
          path: dist/index.html
